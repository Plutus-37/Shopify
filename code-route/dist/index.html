<title>Sprint Code de la route</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout : colonne centrale 920px, cartes sombres, accents vert (réussite) et bleu (progression). */
:root {
  color-scheme: dark;
  --bg: #0c1416;
  --surface: #131f22;
  --surface-2: #1a292d;
  --line: #24383d;
  --fg: #e6efec;
  --muted: #8fa7a2;
  --green: #3ddc97;
  --green-ink: #06281b;
  --blue: #5aa9ff;
  --red: #ff6b6b;
  --amber: #f5b947;
  --font-display: "Sora", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", "Segoe UI", system-ui, sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, monospace;
  --radius: 16px;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
h2 { font-family: var(--font-display); font-size: 1.05rem; font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
.app { max-width: 920px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 40px; }
.muted { color: var(--muted); }
.small { font-size: 0.84rem; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.stack { display: grid; gap: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.two > * { min-width: 0; }

/* En-tête */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 14px; padding: 12px 0; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-size: 1.1rem; letter-spacing: -0.02em; white-space: nowrap; }
.brand b { color: var(--green); font-weight: 700; }
.logo { width: 26px; height: 26px; color: var(--green); display: inline-flex; }
nav { display: flex; gap: 4px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.nav { background: none; border: 0; padding: 8px 12px; border-radius: 10px; color: var(--muted); cursor: pointer; white-space: nowrap; display: inline-flex; gap: 6px; align-items: center; }
.nav:hover { color: var(--fg); background: var(--surface); }
.nav.on { color: var(--fg); background: var(--surface-2); }
.nav:focus-visible, .btn:focus-visible, .opt:focus-visible, .check:focus-visible, .mode:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.badge { background: var(--red); color: #fff; font-size: 0.72rem; border-radius: 999px; padding: 0 6px; font-weight: 700; }
.sync-dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
.s-synced .dot, .sync-dot.s-synced { background: var(--green); }
.s-saving .dot, .sync-dot.s-saving, .s-connecting .dot, .sync-dot.s-connecting { background: var(--blue); }
.s-error .dot, .sync-dot.s-error, .s-full .dot, .sync-dot.s-full { background: var(--red); }
.s-local .dot, .sync-dot.s-local { background: var(--amber); }

/* Cartes et boutons */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; align-content: start; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--surface-2); border-radius: 12px; padding: 11px 18px; cursor: pointer; font-weight: 600; transition: transform .12s ease, background .12s ease; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--green); color: var(--green-ink); border-color: var(--green); }
.btn.ghost { background: transparent; }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn.danger { background: var(--red); color: #2a0707; border-color: var(--red); }
.btn.sm { padding: 7px 12px; font-size: 0.86rem; border-radius: 10px; }
.row-btns { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.pill { display: inline-block; font-size: 0.74rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; font-family: var(--font-num); }
.pill-ok { background: color-mix(in srgb, var(--green) 20%, transparent); color: var(--green); }
.pill-bad { background: color-mix(in srgb, var(--red) 20%, transparent); color: var(--red); }
.pill-hard { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); font-family: var(--font-body); }
.eyebrow { font-size: 0.74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.notice { background: color-mix(in srgb, var(--blue) 14%, var(--surface)); border: 1px solid color-mix(in srgb, var(--blue) 40%, transparent); padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; }

/* Barres */
.bar { position: relative; height: 8px; border-radius: 99px; background: var(--surface-2); overflow: visible; }
.bar-fill { height: 100%; border-radius: 99px; transition: width .4s ease; }
.bar-fill.green { background: var(--green); }
.bar-fill.blue { background: var(--blue); }
.bar-fill.red { background: var(--red); }
.bar-marker { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--fg); border-radius: 2px; }

/* Tableau de bord */
.resume { grid-template-columns: 1fr auto; align-items: center; border-color: color-mix(in srgb, var(--blue) 50%, var(--line)); }
.hero { grid-template-columns: 1.4fr 1fr; gap: 24px; background: linear-gradient(135deg, var(--surface) 0%, color-mix(in srgb, var(--blue) 8%, var(--surface)) 100%); }
.hero-score, .hero-next { display: grid; gap: 8px; align-content: start; min-width: 0; }
.hero-next { border-left: 1px solid var(--line); padding-left: 24px; }
.hero-next .btn { justify-self: start; }
.big { font-family: var(--font-display); font-size: 3.4rem; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.big small { font-size: 1.3rem; color: var(--muted); font-weight: 500; margin-left: 4px; }
.ok { color: var(--green); } .warn { color: var(--amber); } .good { color: var(--green); } .bad { color: var(--red); }
.gauge { display: grid; gap: 4px; margin-top: 4px; }
.gauge-labels { position: relative; height: 16px; font-size: 0.72rem; color: var(--muted); font-family: var(--font-num); }
.gauge-labels span { position: absolute; transform: translateX(-50%); }
.gauge-labels span:nth-child(1) { left: 0; transform: none; }
.gauge-labels span:nth-child(2) { left: 87.5%; }
.gauge-labels span:nth-child(3) { right: 0; transform: none; }
.next-title { font-family: var(--font-display); font-size: 1.25rem; font-weight: 600; }
.prio { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.prio li { display: grid; grid-template-columns: 34px 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 12px; }
.prio-body { min-width: 0; }
.prio-name { font-weight: 600; }
.rank { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; background: color-mix(in srgb, var(--red) 22%, transparent); color: var(--red); }
.prio li:nth-child(2) .rank { background: color-mix(in srgb, var(--amber) 22%, transparent); color: var(--amber); }
.prio li:nth-child(3) .rank { background: color-mix(in srgb, var(--blue) 22%, transparent); color: var(--blue); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
.kpi { gap: 2px; padding: 14px 16px; }
.kpi-v { font-family: var(--font-num); font-size: 1.6rem; font-weight: 600; }
.kpi-v small { font-size: 0.9rem; color: var(--muted); }
.kpi-l { color: var(--muted); font-size: 0.82rem; }
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; }
.theme { display: grid; gap: 5px; min-width: 0; }
.theme-top { display: flex; justify-content: space-between; gap: 8px; font-size: 0.9rem; }
.exams { display: flex; gap: 10px; align-items: flex-end; height: 130px; }
.exam-col { flex: 1; max-width: 46px; display: grid; gap: 4px; justify-items: center; height: 100%; grid-template-rows: 1fr auto; }
.exam-bar-wrap { position: relative; width: 100%; height: 100%; background: var(--surface-2); border-radius: 8px; overflow: hidden; display: flex; align-items: flex-end; }
.exam-bar { width: 100%; border-radius: 8px 8px 0 0; }
.exam-bar.pass { background: var(--green); } .exam-bar.fail { background: var(--amber); }
.exam-line { position: absolute; left: 0; right: 0; bottom: 87.5%; height: 2px; background: var(--fg); opacity: .7; }
.rec { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.rec li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; }
.memo-inline { color: var(--green); font-size: 0.82rem; margin-top: 2px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; }
.r { text-align: right; }

/* Sprint */
.switch { display: flex; gap: 10px; align-items: center; cursor: pointer; font-size: 0.9rem; }
.switch input { width: 18px; height: 18px; accent-color: var(--green); }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.steps li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 12px; border-radius: 12px; background: var(--surface-2); border: 1px solid transparent; }
.steps li.next { border-color: var(--green); }
.steps li.done .step-title { color: var(--muted); text-decoration: line-through; }
.step-body { min-width: 0; }
.step-title { font-weight: 600; }
.check { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); background: transparent; cursor: pointer; font-weight: 800; color: var(--green-ink); display: grid; place-items: center; }
.steps li.done .check { background: var(--green); border-color: var(--green); }

/* Modes */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
.mode { text-align: left; cursor: pointer; transition: border-color .15s ease, transform .15s ease; }
.mode:hover:not(:disabled) { border-color: var(--green); transform: translateY(-2px); }
.mode:disabled { opacity: .55; cursor: not-allowed; }
.mode-n { font-family: var(--font-num); font-size: 0.75rem; color: var(--blue); }
.mode-name { font-family: var(--font-display); font-size: 1.15rem; font-weight: 600; }

/* Quiz */
.quiz { display: grid; gap: 14px; max-width: 760px; margin: 0 auto; }
.quiz-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.quiz-meta { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mode-tag { font-weight: 600; color: var(--blue); }
.timers { display: flex; gap: 8px; }
.timer { font-family: var(--font-num); font-size: 0.85rem; padding: 4px 10px; border-radius: 999px; background: var(--surface-2); }
.timer.late { background: color-mix(in srgb, var(--red) 25%, transparent); color: var(--red); }
.qcard { animation: rise .25s ease; }
@keyframes rise { from { transform: translateY(6px); opacity: .6; } to { transform: none; opacity: 1; } }
.q-head { display: flex; gap: 8px; align-items: center; }
.cat { font-size: 0.75rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
.q-text { font-family: var(--font-body); font-size: 1.12rem; font-weight: 600; line-height: 1.45; letter-spacing: 0; }
.hint { margin-top: -4px; }
.scene { margin: 0; display: grid; gap: 4px; }
.scene > div { border-radius: 12px; overflow: hidden; border: 1px solid var(--line); max-width: 520px; }
.scene svg { display: block; width: 100%; height: auto; }
.scene figcaption { font-size: 0.72rem; color: var(--muted); }
.opts { display: grid; gap: 8px; }
.opt { display: grid; grid-template-columns: 36px 1fr; gap: 12px; align-items: center; text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface-2); cursor: pointer; transition: border-color .12s ease, background .12s ease; min-height: 52px; }
.opt:hover { border-color: color-mix(in srgb, var(--blue) 60%, var(--line)); }
.opt .letter, .corr-opts .letter { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; font-family: var(--font-num); font-weight: 700; background: var(--bg); }
.opt.sel { border-color: var(--blue); background: color-mix(in srgb, var(--blue) 14%, var(--surface-2)); }
.opt.sel .letter { background: var(--blue); color: #04192e; }
.opt.good { border-color: var(--green); background: color-mix(in srgb, var(--green) 13%, var(--surface-2)); }
.opt.good .letter { background: var(--green); color: var(--green-ink); }
.opt.bad { border-color: var(--red); background: color-mix(in srgb, var(--red) 13%, var(--surface-2)); }
.opt.bad .letter { background: var(--red); color: #2a0707; }
.opt-text { min-width: 0; }
.feedback { display: grid; gap: 8px; padding: 14px; border-radius: 12px; border: 1px solid; }
.fb-ok { border-color: color-mix(in srgb, var(--green) 50%, transparent); background: color-mix(in srgb, var(--green) 7%, var(--surface)); }
.fb-bad { border-color: color-mix(in srgb, var(--red) 50%, transparent); background: color-mix(in srgb, var(--red) 7%, var(--surface)); }
.fb-title { font-family: var(--font-display); font-weight: 600; }
.fb-ok .fb-title { color: var(--green); } .fb-bad .fb-title { color: var(--red); }
.trap { color: var(--amber); }
.trap strong { color: var(--amber); }
.memo { font-weight: 600; padding: 8px 12px; border-left: 3px solid var(--green); background: var(--bg); border-radius: 0 8px 8px 0; }
.quiz-actions { display: flex; justify-content: space-between; gap: 10px; position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(to top, var(--bg) 70%, transparent); }
.quiz-actions .btn.primary { min-width: 150px; }

/* Bilan */
.hero-res { justify-items: start; }
.verdict { font-weight: 700; }
.plain { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.plain li { display: flex; justify-content: space-between; gap: 10px; }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.corr { border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; background: var(--surface-2); }
.corr[open] { display: grid; gap: 8px; }
.corr summary { cursor: pointer; font-weight: 500; }
.corr-opts { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.corr-opts li { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border-radius: 8px; }
.corr-opts li.good { background: color-mix(in srgb, var(--green) 15%, transparent); }
.corr-opts li.bad { background: color-mix(in srgb, var(--red) 15%, transparent); }
.c-bad { border-color: color-mix(in srgb, var(--red) 35%, var(--line)); }

/* Données */
.sync-box { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border-radius: 12px; background: var(--surface-2); }
.sync-box .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 6px; flex: none; }
.report { white-space: pre-wrap; font-family: var(--font-num); font-size: 0.78rem; background: var(--bg); padding: 12px; border-radius: 10px; max-height: 240px; overflow: auto; margin: 0; border: 1px solid var(--line); }
textarea { width: 100%; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-family: var(--font-num); font-size: 0.8rem; }
.file { position: relative; overflow: hidden; }
.file input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.foot { text-align: center; margin-top: 28px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--surface-2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 12px; z-index: 20; max-width: calc(100% - 32px); }

@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .hero-next { border-left: 0; padding-left: 0; border-top: 1px solid var(--line); padding-top: 16px; }
  .two, .themes { grid-template-columns: 1fr; }
  .kpis { grid-template-columns: 1fr 1fr; }
  .brand span:last-child { display: none; }
  .big { font-size: 2.8rem; }
  .card { padding: 15px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>

<script>
// Banque de questions originales — Code de la route français (règles en vigueur fin 2026).
// Format : id, c (catégorie), d (difficulté 1-3), q (énoncé), o (propositions), a (index des bonnes réponses),
// e (explication), t (piège, optionnel), m (phrase à mémoriser), r (référence, optionnel), img (scène SVG, optionnel).

window.CATS = {
  LEG: { name: "Dispositions légales", short: "Légal", prior: 2 },
  CON: { name: "Le conducteur", short: "Conducteur", prior: 1 },
  CIR: { name: "La route : circulation et priorités", short: "Circulation", prior: 1 },
  QUI: { name: "Arrêt, stationnement, quitter le véhicule", short: "Quitter véhicule", prior: 1 },
  USA: { name: "Les autres usagers", short: "Usagers", prior: 1 },
  EQU: { name: "Équipements de sécurité", short: "Équipements", prior: 1 },
  SIG: { name: "Signalisation et situations complexes", short: "Signalisation", prior: 0.5 },
  SEC: { name: "Accident et premiers secours", short: "Secours", prior: 0.3 },
};

const OUI_NON = ["Oui", "Non"];

window.QUESTIONS = [
  // ───────────── DISPOSITIONS LÉGALES ─────────────
  { id: "LEG-01", c: "LEG", d: 1, q: "Je viens d'obtenir mon permis par la filière classique. Combien de points compte mon permis probatoire au départ ?",
    o: ["6 points", "8 points", "12 points"], a: [0],
    e: "Le permis probatoire démarre à 6 points. Sans infraction, il atteint 12 points à la fin de la période probatoire.",
    m: "Probatoire = 6 points au départ, 12 à la fin.", r: "Code de la route, art. L223-1" },
  { id: "LEG-02", c: "LEG", d: 2, q: "J'ai obtenu mon permis après un apprentissage anticipé de la conduite (AAC). Sans infraction, combien de temps dure ma période probatoire ?",
    o: ["1 an", "2 ans", "3 ans"], a: [1],
    e: "Avec l'AAC, la période probatoire dure 2 ans (+3 points par an). En filière classique, elle dure 3 ans (+2 points par an).",
    t: "Ne confonds pas : 3 ans = filière classique, 2 ans = conduite accompagnée.",
    m: "AAC = 2 ans ; classique = 3 ans." },
  { id: "LEG-03", c: "LEG", d: 1, q: "Je suis en permis probatoire. Quel est le taux d'alcool maximal autorisé dans le sang ?",
    o: ["0,2 g/l", "0,5 g/l", "0,8 g/l"], a: [0],
    e: "En période probatoire, la limite est de 0,2 g/l de sang (0,10 mg/l d'air expiré), ce qui revient en pratique à zéro verre.",
    m: "Jeune conducteur = 0,2 g/l = zéro verre.", r: "Code de la route, art. R234-1" },
  { id: "LEG-04", c: "LEG", d: 2, q: "Je suis titulaire d'un permis définitif. Quel est le taux maximal autorisé dans l'air expiré ?",
    o: ["0,10 mg/l", "0,25 mg/l", "0,40 mg/l"], a: [1],
    e: "0,5 g/l de sang correspond à 0,25 mg/l d'air expiré. 0,10 mg/l est la limite probatoire ; 0,40 mg/l est le seuil du délit.",
    t: "Sang ÷ 2 = air expiré.", m: "0,5 g/l sang = 0,25 mg/l air.", r: "Code de la route, art. R234-1" },
  { id: "LEG-05", c: "LEG", d: 2, q: "À partir de quel taux d'alcool dans le sang la conduite devient-elle un délit ?",
    o: ["0,5 g/l", "0,8 g/l", "1,2 g/l"], a: [1],
    e: "Entre 0,5 et 0,8 g/l (permis définitif), c'est une contravention. À partir de 0,8 g/l de sang (0,40 mg/l d'air), c'est un délit jugé au tribunal.",
    m: "0,8 g/l = délit.", r: "Code de la route, art. L234-1" },
  { id: "LEG-06", c: "LEG", d: 1, q: "Je téléphone en tenant mon téléphone en main pendant que je conduis. Combien de points vais-je perdre ?",
    o: ["1 point", "3 points", "4 points", "6 points"], a: [1],
    e: "Téléphone tenu en main : 3 points et 135 € d'amende forfaitaire.",
    m: "Téléphone en main = 3 points.", r: "Code de la route, art. R412-6-1" },
  { id: "LEG-07", c: "LEG", d: 2, q: "Je téléphone en conduisant avec une oreillette Bluetooth, sans tenir le téléphone. Est-ce autorisé ?",
    o: OUI_NON, a: [1],

  // ───────────── LE CONDUCTEUR ─────────────
  { id: "CON-01", c: "CON", d: 1, q: "En moyenne, quel est le temps de réaction d'un conducteur attentif ?",
    o: ["0,1 seconde", "1 seconde", "3 secondes"], a: [1],
    e: "On retient 1 seconde pour un conducteur en bonne forme. Il augmente avec la fatigue, l'alcool, le téléphone ou les médicaments.",
    m: "Temps de réaction ≈ 1 seconde." },

    o: ["9 m", "25 m", "50 m"], a: [1],
    e: "90 km/h = 25 m par seconde (90 ÷ 3,6). Pendant la seule seconde de réaction, la voiture parcourt donc environ 25 m sans freiner.",
    t: "Calcul rapide : chiffre des dizaines × 3 ≈ distance en 1 s (9 × 3 = 27 m).", m: "Distance en 1 s ≈ dizaines × 3." },

    o: ["2", "3", "4"], a: [2],

    m: "Vitesse × 2 = freinage × 4." },
  { id: "CON-04", c: "CON", d: 1, q: "Sur route mouillée, ma distance de freinage :",

  { id: "CON-07", c: "CON", d: 1, q: "Pour faire baisser mon taux d'alcool plus vite, quelle méthode est efficace ?",
    o: ["Boire du café", "Prendre une douche froide", "Attendre", "Manger"], a: [2],
    e: "Seul le temps élimine l'alcool, à raison d'environ 0,10 à 0,15 g/l par heure. Café, douche ou repas n'accélèrent pas l'élimination.",

  { id: "CON-08", c: "CON", d: 2, q: "Un médicament porte un pictogramme rouge de niveau 3. Que dois-je faire ?",

    e: "Le niveau 2 impose de demander l'avis d'un médecin ou d'un pharmacien avant de conduire.",
    t: "Ce n'est pas une interdiction : c'est le niveau 3 (rouge).", m: "Orange = demande au médecin." },
  { id: "CON-10", c: "CON", d: 1, q: "Quand ma vitesse augmente, mon champ visuel :",

  { id: "CON-14", c: "CON", d: 2, q: "Quels comportements réduisent la consommation de carburant ?",

  { id: "CIR-18", c: "CIR", d: 1, q: "Un agent de police règle la circulation alors que le feu est vert pour moi. L'agent me fait signe de m'arrêter. Que dois-je faire ?",
    o: ["Passer, le feu est vert", "M'arrêter"], a: [1],
    e: "Les indications d'un agent priment sur les feux et les panneaux.", m: "Agent > feux > panneaux > règles générales." },
  { id: "CIR-19", c: "CIR", d: 1, q: "Le feu passe à l'orange fixe. Je peux m'arrêter sans danger. Que dois-je faire ?",
    o: ["Accélérer pour passer", "M'arrêter"], a: [1],
    e: "Le feu orange fixe impose l'arrêt, sauf si l'arrêt est impossible dans des conditions de sécurité suffisantes.",
    m: "Orange fixe = je m'arrête si je peux." },
  { id: "CIR-20", c: "CIR", d: 2, q: "Un feu jaune clignote à l'intersection. Que dois-je faire ?",
    o: ["M'arrêter obligatoirement", "Passer avec prudence en appliquant les règles de priorité", "Passer, j'ai la priorité"], a: [1],
    e: "Le feu jaune clignotant signale un danger : on passe avec prudence en respectant les panneaux ou la priorité à droite.",
    m: "Jaune clignotant = prudence + règles de priorité." },
  { id: "CIR-21", c: "CIR", d: 3, q: "Le feu est rouge, mais une flèche jaune clignotante indique la droite. Je veux tourner à droite. Que dois-je faire ?",
    o: ["Attendre le vert", "Tourner en cédant le passage aux piétons et aux véhicules", "Tourner, je suis prioritaire"], a: [1],
    e: "La flèche clignotante autorise à tourner dans la direction indiquée, en cédant le passage à tous les usagers, notamment les piétons.",
    m: "Flèche clignotante = je tourne en cédant le passage." },
  { id: "CIR-22", c: "CIR", d: 3, q: "Dans quels cas puis-je dépasser par la droite ?",
    o: ["Un véhicule qui a signalé qu'il tourne à gauche et s'est déporté", "Un tramway en mouvement, si l'espace est suffisant", "Un véhicule lent sur une route à double sens, par commodité"], a: [0, 1],
    e: "Le dépassement se fait par la gauche, sauf deux exceptions principales : un véhicule qui tourne à gauche, et un tramway (dépassé par la droite si l'espace le permet).",
    m: "Par la droite : celui qui tourne à gauche, et le tram." },
  { id: "CIR-23", c: "CIR", d: 2, q: "Dans quels cas le dépassement est-il interdit ?",
    o: ["À l'approche d'un sommet de côte sans visibilité", "Quand le véhicule devant ralentit pour laisser passer un piéton", "Sur une route droite et dégagée à ligne discontinue"], a: [0, 1],
    e: "Dépasser est interdit sans visibilité suffisante (sommet de côte, virage) et quand le véhicule précédent s'arrête ou ralentit pour un piéton.",
    m: "Pas de visibilité, piéton devant = pas de dépassement." },
  { id: "CIR-24", c: "CIR", d: 1, q: "Quelle distance de sécurité minimale dois-je garder avec le véhicule qui me précède ?",
    o: ["1 seconde", "2 secondes", "Aucune règle précise"], a: [1],
    e: "Il faut au moins 2 secondes entre soi et le véhicule devant. On l'augmente par mauvais temps.", m: "Au moins 2 secondes." },
  { id: "CIR-25", c: "CIR", d: 1, img: "arrowLeft", q: "Je circule sur une voie dont la flèche au sol impose de tourner à gauche. Je voudrais continuer tout droit. Si je reste sur cette voie, dois-je respecter la flèche ?",
    o: OUI_NON, a: [0],
    e: "Les flèches directionnelles délimitées par des lignes continues imposent la direction. Si je reste sur cette voie, je tourne à gauche, puis je change d'itinéraire plus loin.",
    t: "Ne coupe pas la ligne continue au dernier moment : suis la flèche et rectifie ton trajet ensuite.", m: "Flèche au sol entre lignes continues = direction obligatoire." },
  { id: "CIR-26", c: "CIR", d: 1, q: "Sur autoroute, j'ai manqué ma sortie. Que dois-je faire ?",
    o: ["Faire marche arrière sur la bande d'arrêt d'urgence", "Continuer jusqu'à la sortie suivante", "Faire demi-tour par une interruption du terre-plein"], a: [1],
    e: "Marche arrière, demi-tour et traversée du terre-plein sont interdits sur autoroute. On continue jusqu'à la prochaine sortie.",
    m: "Sortie ratée = sortie suivante." },
  { id: "CIR-27", c: "CIR", d: 1, q: "Je suis sur la voie d'accélération pour entrer sur l'autoroute. Suis-je prioritaire sur les véhicules qui y circulent déjà ?",
    o: OUI_NON, a: [1],
    e: "Le conducteur qui s'insère doit céder le passage aux véhicules circulant sur l'autoroute. Il adapte sa vitesse sur la voie d'accélération.",
    m: "Je m'insère = je cède." },

  // ───────────── AUTRES USAGERS ─────────────
  { id: "USA-01", c: "USA", d: 1, q: "Un autocar porte à l'arrière un pictogramme représentant deux enfants, l'un plus grand tenant la main d'un plus petit. Que signifie ce pictogramme ?",
    o: ["Le véhicule effectue un transport d'enfants", "Le véhicule est réservé aux personnes handicapées", "Le véhicule transporte exclusivement des adultes", "Le véhicule bénéficie toujours d'une priorité absolue"], a: [0],
    e: "Ce pictogramme signale un transport d'enfants. Il n'accorde aucune priorité ; il invite à la prudence, surtout lors des arrêts.",
    t: "Signal de prudence, pas de priorité.", m: "Pictogramme enfants = prudence, pas priorité." },
  { id: "USA-02", c: "USA", d: 2, q: "Un autocar de transport d'enfants est arrêté, feux de détresse allumés, et des enfants descendent. Que dois-je faire ?",

    e: "Un enfant peut surgir devant ou derrière le car. Il faut ralentir fortement et être prêt à s'arrêter.",
    m: "Car d'enfants à l'arrêt = je ralentis fort." },

    o: OUI_NON, a: [0],
    e: "Une personne utilisant une trottinette non motorisée (ou des rollers) est assimilée à un piéton.", m: "Sans moteur = piéton." },
  { id: "USA-04", c: "USA", d: 1, q: "Une personne utilise une trottinette électrique. Est-elle soumise exactement aux mêmes règles qu'un piéton ?",
    o: OUI_NON, a: [1],
    e: "La trottinette électrique est un engin de déplacement personnel motorisé (EDPM), avec des règles propres : piste cyclable ou chaussée, 25 km/h maximum, une seule personne.",
    m: "Avec moteur = EDPM, pas piéton." },
  { id: "USA-05", c: "USA", d: 2, q: "Quel âge minimum faut-il avoir pour conduire une trottinette électrique ?",
    o: ["12 ans", "14 ans", "16 ans"], a: [1],
    e: "Depuis 2023, l'âge minimum pour conduire un engin de déplacement personnel motorisé est de 14 ans.", m: "Trottinette électrique : 14 ans minimum." },
  { id: "USA-06", c: "USA", d: 2, q: "Une trottinette électrique peut-elle circuler sur le trottoir ?",
    o: ["Oui, librement", "Non, sauf autorisation locale, et alors à l'allure du pas"], a: [1],
    e: "Les EDPM sont interdits sur le trottoir, sauf si le maire l'autorise ; ils roulent alors à l'allure du pas. Ils peuvent être tenus à la main comme un piéton.",
    m: "Trottinette électrique : pas sur le trottoir." },
  { id: "USA-07", c: "USA", d: 1, img: "crosswalk", q: "Un piéton manifeste clairement son intention de traverser au passage piéton. Que dois-je faire ?",
    o: ["Passer, il n'est pas encore engagé", "M'arrêter pour le laisser traverser"], a: [1],
    e: "Le conducteur doit céder le passage au piéton qui s'engage ou qui manifeste clairement l'intention de traverser.",
    t: "Le piéton n'a pas besoin d'avoir posé le pied sur la chaussée.", m: "Intention claire = je m'arrête.", r: "Code de la route, art. R415-11" },
  { id: "USA-08", c: "USA", d: 2, q: "En agglomération, un bus signale qu'il quitte son arrêt. Que dois-je faire ?",
    o: ["Accélérer pour passer avant", "Ralentir et m'arrêter si nécessaire pour le laisser repartir", "Klaxonner"], a: [1],
    e: "En agglomération, il faut faciliter le départ des véhicules de transport en commun qui quittent un arrêt signalé.",
    m: "En ville, le bus qui repart passe." },
  { id: "USA-09", c: "USA", d: 2, q: "Je circule dans une zone de rencontre. Quelles affirmations sont exactes ?",
    o: ["La vitesse est limitée à 20 km/h", "Les piétons peuvent circuler sur la chaussée", "Les piétons sont prioritaires", "La vitesse est limitée à 30 km/h"], a: [0, 1, 2],
    e: "Zone de rencontre : 20 km/h, piétons prioritaires et autorisés à marcher sur la chaussée. Zone 30 : 30 km/h. Aire piétonne : allure du pas.",
    m: "Rencontre = 20 ; zone 30 = 30 ; aire piétonne = pas." },
  { id: "USA-10", c: "USA", d: 2, q: "J'emprunte une rue à sens unique dont l'entrée porte le panonceau « sauf cycles ». Que puis-je rencontrer ?",
    o: ["Des cyclistes venant en sens inverse", "Des voitures venant en sens inverse", "Rien de particulier"], a: [0],
    e: "C'est un double-sens cyclable : les cyclistes peuvent circuler dans les deux sens. Il faut serrer à droite et rester attentif.",
    m: "« Sauf cycles » = vélos en face possibles." },
  { id: "USA-11", c: "USA", d: 2, q: "Des cyclistes roulent à deux de front sur une route. Dans quels cas doivent-ils se mettre en file ?",
    o: ["À la tombée de la nuit", "Lorsqu'un véhicule veut les dépasser", "Lorsque les conditions de circulation l'exigent", "Jamais"], a: [0, 1, 2],
    e: "Les cyclistes peuvent rouler à deux de front, mais doivent se mettre en file la nuit, quand un véhicule veut dépasser ou quand la circulation l'exige.",
    m: "Deux de front oui, sauf nuit, dépassement ou trafic." },
  { id: "USA-12", c: "USA", d: 1, q: "Un enfant de 10 ans fait du vélo. Le casque est-il obligatoire ?",
    o: OUI_NON, a: [0],
    e: "Le casque est obligatoire pour les cyclistes de moins de 12 ans, conducteurs ou passagers.", m: "Vélo < 12 ans = casque obligatoire." },
  { id: "USA-13", c: "USA", d: 2, q: "Un enfant de 7 ans roule à vélo. Peut-il circuler sur le trottoir ?",
    o: ["Oui, à l'allure du pas", "Non, jamais"], a: [0],
    e: "Les enfants de moins de 8 ans peuvent rouler à vélo sur les trottoirs, à l'allure du pas et sans gêner les piétons.", m: "Vélo sur trottoir : moins de 8 ans, au pas." },
  { id: "USA-14", c: "USA", d: 1, q: "Une ambulance arrive derrière moi avec feux bleus et sirène deux tons. Que dois-je faire ?",
    o: ["Freiner brusquement", "Faciliter son passage en me décalant si possible", "Garder ma trajectoire, je n'ai rien à faire"], a: [1],
    e: "Il faut faciliter le passage des véhicules prioritaires en se décalant ou en s'arrêtant si nécessaire, sans manœuvre dangereuse.",
    m: "Bleu + sirène = je facilite le passage." },
  { id: "USA-15", c: "USA", d: 2, q: "Une dépanneuse avec un gyrophare orange est arrêtée sur la chaussée. A-t-elle la priorité ?",
    o: OUI_NON, a: [1],
    e: "Le feu spécial orange signale un danger ou un véhicule lent ; il ne donne aucune priorité. Seuls les véhicules à feux bleus et sirène sont prioritaires.",
    t: "Orange = danger ; bleu + sirène = priorité.", m: "Gyrophare orange = attention, pas priorité." },
  { id: "USA-16", c: "USA", d: 1, q: "Un camion porte un autocollant « angles morts ». Que signale-t-il ?",
    o: ["Les zones où le chauffeur ne peut pas me voir", "Que le camion transporte des matières dangereuses", "Que le camion est prioritaire"], a: [0],
    e: "Cette signalétique est obligatoire sur les véhicules de plus de 3,5 t. Elle rappelle aux cyclistes, piétons et deux-roues les zones invisibles pour le chauffeur.",
    m: "Angles morts : si je ne vois pas ses rétros, il ne me voit pas." },
  { id: "USA-17", c: "USA", d: 2, q: "Hors agglomération, sur une route sans trottoir, de quel côté les piétons doivent-ils marcher ?",
    o: ["Sur le bord gauche, face aux véhicules", "Sur le bord droit"], a: [0],
    e: "Hors agglomération, les piétons marchent en principe sur le bord gauche de la chaussée, face aux véhicules, sauf si cela compromet leur sécurité.",
    m: "Piéton hors agglo = à gauche, face au trafic." },
  { id: "USA-18", c: "USA", d: 2, q: "Au feu rouge, un panonceau autorise les cyclistes à tourner à droite. Un cycliste devant moi tourne à droite alors que le feu est rouge. Est-il en infraction ?",
    o: OUI_NON, a: [1],
    e: "Le panonceau de cédez-le-passage cycliste au feu autorise les cyclistes à franchir le feu rouge dans la direction indiquée, en cédant le passage.",
    m: "Panonceau vélo au feu = le cycliste peut passer en cédant." },
  { id: "USA-19", c: "USA", d: 1, img: "sasVelo", q: "Le feu est rouge. Devant la ligne d'arrêt des voitures se trouve une zone avec un vélo dessiné au sol (sas vélo). Puis-je m'y arrêter avec ma voiture ?",
    o: OUI_NON, a: [1],
    e: "Le sas vélo est réservé aux cycles. Les voitures doivent s'arrêter à la première ligne d'arrêt.",
    m: "Sas vélo = pour les vélos, j'attends derrière." },
  { id: "USA-20", c: "USA", d: 2, q: "Une personne avec une canne blanche s'apprête à traverser hors passage piéton. Que dois-je faire ?",
    o: ["Continuer, elle n'est pas sur un passage", "M'arrêter et la laisser traverser"], a: [1],
    e: "La canne blanche signale une personne aveugle ou malvoyante. Il faut s'arrêter et faciliter sa traversée, même hors passage.",
    m: "Canne blanche = je m'arrête." },

  // ───────────── ÉQUIPEMENTS DE SÉCURITÉ ─────────────
  { id: "EQU-01", c: "EQU", d: 1, q: "Quels équipements dois-je obligatoirement avoir dans ma voiture ?",
    o: ["Un gilet de haute visibilité", "Un triangle de présignalisation", "Un extincteur", "Une trousse de secours"], a: [0, 1],
    e: "Gilet et triangle sont obligatoires. Extincteur et trousse de secours sont recommandés mais pas obligatoires pour une voiture particulière.",
    m: "Obligatoire = gilet + triangle." },
  { id: "EQU-02", c: "EQU", d: 2, q: "Où dois-je ranger le gilet de haute visibilité ?",
    o: ["Dans le coffre", "À portée de main, pour l'enfiler avant de sortir"], a: [1],
    e: "Le gilet doit être accessible depuis le poste de conduite pour être enfilé avant de sortir du véhicule.",
    m: "Gilet à portée de main, enfilé avant de sortir." },
  { id: "EQU-03", c: "EQU", d: 2, q: "À quelle distance minimale du véhicule dois-je placer le triangle de présignalisation ?",
    o: ["10 m", "30 m", "100 m"], a: [1],
    e: "Le triangle se place à au moins 30 m en amont du véhicule. Sa pose n'est pas exigée si elle met en danger, notamment sur autoroute.",
    m: "Triangle : au moins 30 m." },
  { id: "EQU-04", c: "EQU", d: 2, q: "Il pleut fortement. Puis-je allumer mon feu de brouillard arrière ?",
    o: OUI_NON, a: [1],
    e: "Le feu de brouillard arrière est réservé au brouillard et à la neige. Sous la pluie, il éblouirait les conducteurs derrière.",
    t: "Le feu de brouillard AVANT, lui, est autorisé par forte pluie.", m: "Brouillard arrière = brouillard ou neige seulement." },
  { id: "EQU-05", c: "EQU", d: 2, q: "Dans quels cas puis-je utiliser mes feux de brouillard avant ?",
    o: ["Par brouillard", "Par chute de neige", "Par forte pluie", "En ville la nuit pour mieux voir"], a: [0, 1, 2],
    e: "Les feux de brouillard avant sont autorisés par brouillard, neige ou forte pluie (et sur routes étroites et sinueuses hors agglomération).",
    m: "Brouillard avant : brouillard, neige, forte pluie." },
  { id: "EQU-06", c: "EQU", d: 1, img: "dashRed", q: "En roulant, un voyant rouge s'allume au tableau de bord. Que dois-je faire ?",
    o: ["Continuer et consulter un garage dans la semaine", "M'arrêter dès que possible en sécurité", "L'ignorer s'il s'éteint"], a: [1],
    e: "Rouge = alerte grave (pression d'huile, freins, température...). Il faut s'arrêter dès que possible. Orange = anomalie à faire vérifier. Vert ou bleu = information.",
    m: "Rouge stop ; orange garage ; vert/bleu info." },
  { id: "EQU-07", c: "EQU", d: 1, img: "dashBlue", q: "Ce voyant bleu est allumé. Quels feux sont en fonction ?",
    o: ["Les feux de croisement", "Les feux de route", "Les feux de brouillard"], a: [1],
    e: "Le seul voyant d'éclairage bleu est celui des feux de route. Les feux de croisement ont un voyant vert.",
    m: "Bleu = pleins phares." },
  { id: "EQU-08", c: "EQU", d: 2, q: "Le voyant orange de l'ABS reste allumé en roulant. Que se passe-t-il ?",
    o: ["Je n'ai plus du tout de freins", "Les freins fonctionnent, mais sans l'aide de l'ABS", "Rien, c'est normal"], a: [1],
    e: "Le freinage classique reste disponible, mais les roues peuvent se bloquer en freinage d'urgence. Il faut faire vérifier rapidement.",
    m: "Voyant ABS = freins OK, ABS hors service." },
  { id: "EQU-09", c: "EQU", d: 2, q: "Quel est l'intérêt principal de l'ABS ?",
    o: ["Garder la possibilité de diriger le véhicule pendant un freinage d'urgence", "Réduire toujours la distance de freinage", "Accélérer plus fort au démarrage"], a: [0],
    e: "L'ABS empêche le blocage des roues pour que je puisse continuer à braquer en freinant fort. Il ne raccourcit pas forcément la distance de freinage.",
    t: "ABS ne veut pas dire « freiner plus court ».", m: "ABS = je freine fort ET je dirige." },
  { id: "EQU-10", c: "EQU", d: 2, q: "Quel est le rôle de l'ESP (correcteur électronique de trajectoire) ?",
    o: ["Corriger une perte de trajectoire dans les limites des lois physiques", "Permettre de rouler plus vite en virage sans risque", "Remplacer les pneus neige"], a: [0],
    e: "L'ESP freine certaines roues pour corriger un dérapage. Il ne supprime pas les limites d'adhérence.", m: "ESP aide, mais ne fait pas de miracle." },
  { id: "EQU-11", c: "EQU", d: 2, q: "Quelle est la différence entre un limiteur et un régulateur de vitesse ?",
    o: ["Le limiteur empêche de dépasser une vitesse choisie ; le régulateur maintient une vitesse sans action sur l'accélérateur", "Ce sont deux noms du même système", "Le régulateur empêche de dépasser une vitesse ; le limiteur la maintient"], a: [0],
    e: "Limiteur : plafond de vitesse, je garde le pied sur l'accélérateur. Régulateur : il maintient la vitesse tout seul, à réserver aux trafics fluides.",
    m: "Limiteur = plafond ; régulateur = pilote." },
  { id: "EQU-12", c: "EQU", d: 1, q: "Quelle est la profondeur minimale légale des sculptures d'un pneu ?",
    o: ["1 mm", "1,6 mm", "3 mm"], a: [1],
    e: "La profondeur minimale est de 1,6 mm. Les témoins d'usure dans les rainures l'indiquent.", m: "Pneu : 1,6 mm minimum." },
  { id: "EQU-13", c: "EQU", d: 1, q: "Quand dois-je vérifier la pression des pneus ?",
    o: ["À froid", "Après un long trajet", "Peu importe"], a: [0],
    e: "La pression se vérifie à froid (après quelques kilomètres maximum), car elle augmente quand le pneu chauffe.", m: "Pression des pneus à froid." },
  { id: "EQU-14", c: "EQU", d: 2, q: "Comment régler l'appuie-tête ?",
    o: ["Le haut de l'appuie-tête au niveau du haut de la tête", "Au niveau de la nuque", "Le plus bas possible"], a: [0],
    e: "Un appuie-tête bien réglé, avec son haut au niveau du sommet du crâne et proche de la tête, limite le coup du lapin.",
    m: "Appuie-tête = haut de la tête." },
  { id: "EQU-15", c: "EQU", d: 2, q: "J'installe un siège enfant dos à la route sur le siège passager avant. Que dois-je faire ?",
    o: ["Désactiver l'airbag frontal passager", "Laisser l'airbag activé pour plus de protection", "Avancer le siège au maximum"], a: [0],
    e: "Un airbag frontal qui se déclenche face à un siège dos à la route peut tuer l'enfant. Il faut le désactiver.",
    m: "Siège dos à la route devant = airbag OFF." },
  { id: "EQU-16", c: "EQU", d: 3, q: "Un enfant de 8 ans peut-il voyager à l'avant d'une voiture ?",
    o: ["Oui, toujours", "Non, sauf exceptions (pas de places arrière, places arrière déjà occupées par des enfants, siège dos à la route avec airbag désactivé)", "Oui, s'il porte la ceinture"], a: [1],
    e: "Les enfants de moins de 10 ans voyagent à l'arrière, sauf exceptions prévues par le Code.",
    m: "Moins de 10 ans = à l'arrière, sauf exceptions." },
  { id: "EQU-17", c: "EQU", d: 3, q: "Dans les communes de montagne concernées par la loi Montagne, du 1er novembre au 31 mars, que dois-je avoir ?",
    o: ["Des pneus hiver (ou 4 saisons homologués)", "Des chaînes ou chaussettes à neige dans le coffre", "Des pneus cloutés obligatoirement"], a: [0, 1],
    e: "L'obligation est remplie avec des pneus hiver/4 saisons homologués OU des dispositifs antidérapants (chaînes, chaussettes) dans le coffre. Les pneus cloutés ne sont jamais obligatoires.",
    t: "Les deux premières propositions sont des solutions alternatives valables : c'est pourquoi les deux sont justes.", m: "Loi Montagne : pneus hiver OU chaînes à bord." },
  { id: "EQU-18", c: "EQU", d: 2, q: "Dans quels cas puis-je allumer les feux de détresse ?",
    o: ["Mon véhicule est immobilisé et constitue un danger", "Je ralentis brusquement à l'approche d'un bouchon sur autoroute", "Je stationne en double file pour une course rapide"], a: [0, 1],
    e: "Les feux de détresse signalent un danger : véhicule en panne ou accidenté, ralentissement brusque. Ils n'autorisent pas un stationnement interdit.",
    t: "Les warnings ne rendent jamais un stationnement légal.", m: "Warnings = danger, pas excuse." },

  // ───────────── ARRÊT, STATIONNEMENT, QUITTER LE VÉHICULE ─────────────
  { id: "QUI-01", c: "QUI", d: 1, img: "busZigzag", q: "Je rencontre un marquage jaune en zigzag qui signale un emplacement réservé à l'arrêt des bus. Puis-je le franchir pour circuler, lorsque la manœuvre est autorisée ?",

// Illustrations SVG originales, schématiques (vue de dessus ou panneaux).
// Chaque scène est une chaîne SVG autonome, couleurs fixes (lisibles sur fond clair ou sombre).
(function () {
  const W = 400, H = 240;
  const wrap = (inner, bg = "#2c3a33") =>
    `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img">` +
    `<rect width="${W}" height="${H}" fill="${bg}"/>${inner}</svg>`;

  // Voiture vue de dessus, orientée vers le haut (rot en degrés).
  const car = (x, y, rot = 0, color = "#3b82f6", label = "") =>
    `<g transform="translate(${x} ${y}) rotate(${rot})">` +
    `<rect x="-13" y="-24" width="26" height="48" rx="7" fill="${color}" stroke="#0b1210" stroke-width="1.5"/>` +
    `<rect x="-10" y="-14" width="20" height="10" rx="2" fill="#cfe3f3" opacity=".9"/>` +
    `<rect x="-10" y="10" width="20" height="7" rx="2" fill="#cfe3f3" opacity=".7"/>` +
    `<rect x="-11" y="-24" width="6" height="3" fill="#fff6c4"/><rect x="5" y="-24" width="6" height="3" fill="#fff6c4"/>` +
    `</g>` +

// Moteur pur (sans DOM) : statistiques, répétition espacée, sélection des questions, scores.
// Testable sous Node : window.Engine.
(function () {
  const MIN = 60 * 1000, HOUR = 60 * MIN, DAY = 24 * HOUR;
  // Intervalles Leitner adaptés à une révision sur 24 h.
  const INTERVALS = [0, 10 * MIN, 1 * HOUR, 5 * HOUR, 1 * DAY, 3 * DAY];
  // Répartition d'un test de 40 questions par thème.
  const EXAM_MIX = { LEG: 6, CON: 5, CIR: 7, QUI: 5, USA: 5, EQU: 5, SIG: 5, SEC: 2 };
  const PASS = 35;

  const emptyState = () => ({ v: 1, q: {}, sessions: [], sprint: { done: {} }, settings: { examTimer: true, stepTimer: true }, updated: 0 });

  const shuffle = (arr, rnd = Math.random) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  const sameSet = (a, b) => a.length === b.length && a.every((x) => b.includes(x));
  const isCorrect = (question, chosen) => sameSet([...new Set(chosen)].sort(), question.a.slice().sort());

  const stat = (state, id) => state.q[id] || null;

  // Enregistre une réponse. Retourne le nouvel état (immuable).
  function recordAnswer(state, question, chosen, ms, now = Date.now()) {
    const ok = isCorrect(question, chosen);
    const prev = state.q[question.id] || { s: 0, c: 0, w: 0, box: 0, due: 0, rt: 0, last: 0, ok: null, hist: [] };
    const s = prev.s + 1;
    let box;
    if (ok) box = prev.s === 0 ? 3 : Math.min(5, prev.box + 1); // première réponse juste : déjà connue
    else box = 0;
    const rt = Math.round(prev.rt ? prev.rt * 0.6 + ms * 0.4 : ms);
    const hist = (prev.hist || []).concat(ok ? 1 : 0).slice(-8);
    const next = { s, c: prev.c + (ok ? 1 : 0), w: prev.w + (ok ? 0 : 1), box, due: now + INTERVALS[box], rt, last: now, ok, hist };
    return { ok, state: { ...state, q: { ...state.q, [question.id]: next }, updated: now } };
  }

  // Niveau de maîtrise 0-100.
  function mastery(st) {
    if (!st || !st.s) return null;
    const recent = st.hist && st.hist.length ? st.hist.reduce((a, b) => a + b, 0) / st.hist.length : st.c / st.s;
    const m = (st.box / 5) * 0.6 + recent * 0.4;
    return Math.round((st.ok ? m : Math.min(m, 0.3)) * 100);
  }

  const isActiveError = (st) => !!st && st.w > 0 && (st.box < 3 || st.ok === false);
  const isWeak = (st) => !!st && st.s > 0 && (st.ok === false || st.box < 3);

  // Statistiques par thème.
  function catStats(state, questions, cats) {
    const out = {};
    for (const k of Object.keys(cats)) out[k] = { key: k, n: 0, att: 0, c: 0, w: 0, seen: 0, weak: 0, active: 0 };
    for (const q of questions) {
      const o = out[q.c]; if (!o) continue;
      o.n++;
      const st = state.q[q.id];
      if (st && st.s) { o.seen++; o.att += st.s; o.c += st.c; o.w += st.w; if (isWeak(st)) o.weak++; if (isActiveError(st)) o.active++; }
    }
    for (const k of Object.keys(out)) {
      const o = out[k], prior = cats[k].prior || 0;
      // Taux d'erreur estimé : erreurs observées + a priori issu du résultat officiel (33/40).
      o.errRate = (o.w + prior * 1.2 + 0.4) / (o.att + 6);
      o.acc = o.att ? o.c / o.att : null;
      // Probabilité de réussite estimée : a priori calé pour redonner ≈ 33/40 sans aucune réponse.
      const p0 = 0.9 - prior * 0.075;
      o.pSuccess = (o.c + p0 * 4) / (o.att + 4);
      o.weakness = o.errRate + o.active * 0.04;
    }
    return out;
  }

  function priorityCats(state, questions, cats, n = 3) {
    const cs = catStats(state, questions, cats);
    return Object.values(cs).sort((a, b) => b.weakness - a.weakness).slice(0, n);
  }

  // Estimation du score à l'examen (/40) à partir des thèmes et des examens blancs récents.
  function readiness(state, questions, cats) {
    const cs = catStats(state, questions, cats);
    const total = Object.values(EXAM_MIX).reduce((a, b) => a + b, 0);
    let est = 0;
    for (const [k, n] of Object.entries(EXAM_MIX)) est += n * Math.max(0, Math.min(1, cs[k].pSuccess));
    est = (est / total) * 40;
    const exams = state.sessions.filter((s) => s.mode === "exam" && s.n === 40).slice(-3);
    if (exams.length) {
      const avg = exams.reduce((a, s) => a + s.correct, 0) / exams.length;
      est = est * 0.5 + avg * 0.5;
    }
    const answered = Object.values(state.q).reduce((a, s) => a + s.s, 0);
    return { score: Math.round(est * 10) / 10, answered, exams: exams.length, confident: answered >= 60 };
  }

  // Sélection pondérée.
  function scoreFor(q, state, cs, now, opts = {}) {
    const st = state.q[q.id];
    let sc = Math.random() * 1.5;
    sc += (cs[q.c] ? cs[q.c].weakness : 0.2) * 8;
    if (!st || !st.s) sc += opts.preferNew ? 3 : 1.2;
    else {
      if (st.ok === false) sc += 3.5;
      if (st.due <= now) sc += 2;
      else sc -= 2.5 * (st.box / 5);
      if (st.box >= 4 && st.ok) sc -= 3;
    }
    if (opts.hard) sc += q.d * 1.5 + (q.t ? 1 : 0) + (q.a.length > 1 ? 1 : 0);
    return sc;
  }

  function pickMix(questions, state, cats, mix, opts = {}) {
    const now = Date.now();
    const cs = catStats(state, questions, cats);
    let picked = [];
    for (const [c, n] of Object.entries(mix)) {
      const pool = questions.filter((q) => q.c === c);
      const ranked = pool
        .map((q) => {
          const st = state.q[q.id];
          let s = Math.random() * 2;
          if (opts.preferUnseen && (!st || !st.s)) s += 3;
          if (opts.leastRecent && st) s -= Math.min(3, (now - st.last) < HOUR ? 3 : 0);
          if (opts.hardShare && q.d === 3) s += 1;
          if (opts.weighted) s += scoreFor(q, state, cs, now) * 0.3;
          return { q, s };
        })
        .sort((a, b) => b.s - a.s);
      picked = picked.concat(ranked.slice(0, n).map((x) => x.q));
    }
    return shuffle(picked);
  }

  function buildSession(mode, questions, state, cats, n) {
    const now = Date.now();
    const cs = catStats(state, questions, cats);
    if (mode === "diag") return pickMix(questions, state, cats, EXAM_MIX, { preferUnseen: true });
    if (mode === "exam") return pickMix(questions, state, cats, EXAM_MIX, { leastRecent: true, hardShare: true });
    if (mode === "errors") {
      const errs = questions.filter((q) => isActiveError(state.q[q.id]));
      return shuffle(errs).sort((a, b) => (state.q[a.id].ok === false ? 0 : 1) - (state.q[b.id].ok === false ? 0 : 1));
    }
    let pool = questions, opts = {};
    if (mode === "hard") { pool = questions.filter((q) => q.d === 3 || q.t || q.a.length > 1); opts.hard = true; }
    if (mode === "consolidate") {
      const weak = questions.filter((q) => { const st = state.q[q.id]; return st && st.s && (isWeak(st) || st.due <= now); });
      pool = weak.length >= 10 ? weak : questions;
    }
    const ranked = pool.map((q) => ({ q, s: scoreFor(q, state, cs, now, opts) })).sort((a, b) => b.s - a.s);
    const size = n || (mode === "hard" ? 20 : 25);
    // Limite par thème pour garder de la variété (sauf mode ciblé où l'on concentre).
    const cap = mode === "target" ? Math.ceil(size * 0.45) : Math.ceil(size * 0.35);
    const per = {}; const out = [];
    for (const { q } of ranked) {
      if (out.length >= size) break;
      per[q.c] = per[q.c] || 0;
      if (per[q.c] >= cap) continue;
      per[q.c]++; out.push(q);
    }
    return shuffle(out);
  }

  // Résumé d'une session terminée.
  function summarize(mode, results, questions, startedAt, now = Date.now()) {
    const byId = Object.fromEntries(questions.map((q) => [q.id, q]));
    const firsts = []; const seen = new Set();
    for (const r of results) { if (seen.has(r.id)) continue; seen.add(r.id); firsts.push(r); }
    const byCat = {};
    for (const r of firsts) {
      const c = byId[r.id].c; byCat[c] = byCat[c] || { n: 0, c: 0 };
      byCat[c].n++; if (r.ok) byCat[c].c++;
    }
    return {
      id: "s" + now.toString(36), mode, start: startedAt, end: now,
      n: firsts.length, correct: firsts.filter((r) => r.ok).length,
      byCat, wrong: firsts.filter((r) => !r.ok).map((r) => r.id),
    };
  }

  // Texte compact pour l'assistant.
  function assistantReport(state, questions, cats) {
    const cs = catStats(state, questions, cats);
    const r = readiness(state, questions, cats);
    const lines = [];
    lines.push(`Révision code de la route — rapport du ${new Date().toLocaleString("fr-FR")}`);
    lines.push(`Score estimé : ${r.score}/40 (objectif 35). Réponses données : ${r.answered}.`);
    lines.push("Par thème (réussite / tentatives / erreurs actives) :");
    for (const o of Object.values(cs)) lines.push(`- ${cats[o.key].name} : ${o.acc == null ? "—" : Math.round(o.acc * 100) + " %"} / ${o.att} / ${o.active}`);
    const ex = state.sessions.filter((s) => s.mode === "exam");
    if (ex.length) lines.push("Examens blancs : " + ex.map((s) => `${s.correct}/${s.n}`).join(", "));
    const rec = questions.filter((q) => (state.q[q.id] || {}).w >= 1).sort((a, b) => state.q[b.id].w - state.q[a.id].w).slice(0, 15);
    if (rec.length) {
      lines.push("Questions ratées (nb d'erreurs, dernière réponse) :");
      for (const q of rec) { const st = state.q[q.id]; lines.push(`- ${q.id} (${st.w}×, ${st.ok ? "réussie" : "ratée"}) ${q.q}`); }
    }
    return lines.join("\n");
  }

  window.Engine = { INTERVALS, EXAM_MIX, PASS, emptyState, shuffle, isCorrect, recordAnswer, mastery, isActiveError, isWeak, catStats, priorityCats, readiness, buildSession, summarize, assistantReport, stat };
})();

// ───────── Persistance : localStorage + base de l'artifact ─────────
function loadLocal() {
  try { const s = JSON.parse(localStorage.getItem(LS_KEY)); if (s && s.v === 1) return s; } catch (e) { /* stockage indisponible */ }
  return null;
}
function saveLocal(s) { try { localStorage.setItem(LS_KEY, JSON.stringify(s)); } catch (e) { /* ignore */ } }

function validState(s) {
  return s && typeof s === "object" && s.v === 1 && s.q && typeof s.q === "object" && Array.isArray(s.sessions);
}

function useStore() {
  const [state, setState] = useState(() => {
    const s = loadLocal() || E.emptyState();
    return { ...E.emptyState(), ...s, settings: { ...E.emptyState().settings, ...(s.settings || {}) } };
  });
  const [sync, setSync] = useState("connecting");
  const dbRef = useRef(null), pending = useRef(null), flying = useRef(false), timer = useRef(null), lastRemote = useRef(0);

  const flush = useCallback(async () => {
    const db = dbRef.current; const s = pending.current;
    if (!db || !s || flying.current) return;
    pending.current = null; flying.current = true; setSync("saving");
    try {
      const { run, ...rest } = s;
      await db.doc("progress/main").set({ updated: s.updated, payload: JSON.stringify(rest) });
      lastRemote.current = s.updated; setSync("synced");
    } catch (e) {
      setSync(e && e.code === "quota_exceeded" ? "full" : "error");
    } finally {
      flying.current = false;
      if (pending.current) timer.current = setTimeout(flush, 1500);
    }
  }, []);

  useEffect(() => {
    let alive = true;
    const c = window.claude;
    if (!c || !c.use) { setSync("local"); return; }
    const to = setTimeout(() => alive && setSync((x) => (x === "connecting" ? "local" : x)), 10000);
    c.use("db").then(async (db) => {
      if (!alive) return;
      if (!db) { clearTimeout(to); setSync("local"); return; }
      dbRef.current = db;
      try {
        const snap = await db.doc("progress/main").get();
        clearTimeout(to);
        if (snap.exists) {
          const data = snap.data();
          const remote = JSON.parse(data.payload);
          setState((cur) => {
            if (validState(remote) && (remote.updated || 0) > (cur.updated || 0)) {
              const merged = { ...E.emptyState(), ...remote, run: cur.run };
              saveLocal(merged); return merged;
            }
            if ((cur.updated || 0) > (remote.updated || 0)) { pending.current = cur; setTimeout(flush, 500); }
            return cur;
          });
          lastRemote.current = data.updated || 0;
        } else {
          setState((cur) => { if (cur.updated) { pending.current = cur; setTimeout(flush, 500); } return cur; });
        }
        setSync("synced");
      } catch (e) { clearTimeout(to); setSync("error"); }
    }).catch(() => { clearTimeout(to); setSync("local"); });
    return () => { alive = false; };
  }, [flush]);

  const update = useCallback((fn) => {
    setState((cur) => {
      const next = typeof fn === "function" ? fn(cur) : fn;
      saveLocal(next);
      if (dbRef.current && next.updated !== cur.updated) {
        pending.current = next;
        clearTimeout(timer.current); timer.current = setTimeout(flush, 2500);
      }
      return next;
    });
  }, [flush]);

  useEffect(() => {
    const h = () => { if (document.visibilityState === "hidden" && pending.current) { clearTimeout(timer.current); flush(); } };
    document.addEventListener("visibilitychange", h);
    return () => document.removeEventListener("visibilitychange", h);
  }, [flush]);

  return [state, update, sync];
}

function nextStep(state) {
  for (const s of SPRINT) for (const st of s.steps) if (!state.sprint.done[st.id]) return { session: s.title, step: st };
  return null;
}

// ───────── Sprint ─────────
function Sprint({ state, update, start }) {

    </section>

      const done = sess.steps.filter((s) => state.sprint.done[s.id]).length;
      return html`<section className="card" key=${sess.title}>

            <button className="check" aria-label=${isDone ? "Décocher" : "Cocher"} onClick=${() => toggle(st.id)}>${isDone ? "✓" : ""}</button>
            <div className="step-body"><div className="step-title">${st.label}</div><div className="muted small">${st.min} min · ${MODES[st.mode].name}${st.n ? ` · jusqu'à ${st.n} questions` : ""}</div></div>
            <button className=${"btn sm " + (isNext ? "primary" : "ghost")} onClick=${() => start(st.mode, st)}>${isDone ? "Refaire" : "Lancer"}</button></li>`;
        })}</ol>
      </section>`;
    })}
  </div>`;
}

// ───────── Modes ─────────
function Modes({ state, start }) {
  const active = QUESTIONS.filter((q) => E.isActiveError(state.q[q.id])).length;
  const order = ["diag", "target", "errors", "hard", "exam"];
  return html`<div className="modes">${order.map((k, i) => html`<button className="card mode" key=${k} onClick=${() => start(k)} disabled=${k === "errors" && !active}>
    <div className="mode-n">Mode ${i + 1}</div><div className="mode-name">${MODES[k].name}${k === "errors" ? html` <span className="pill pill-bad">${active}</span>` : ""}</div>
    <div className="muted small">${k === "errors" && !active ? "Aucune erreur active pour l'instant." : MODES[k].desc}</div></button>`)}</div>`;
}

// ───────── Quiz ─────────
function Quiz({ state, update, finish, onQuit }) {
  const run = state.run;
  const mode = MODES[run.mode];
  const q = QBY[run.ids[run.idx]];
  const [chosen, setChosen] = useState([]);
  const [feedback, setFeedback] = useState(null);
  const shownAt = useRef(Date.now());
  const [now, setNow] = useState(Date.now());
  const deadline = useRef(Date.now() + 20000);
  const done = useRef(false);
  const examTimer = run.mode === "exam" && state.settings.examTimer;

  useEffect(() => { setChosen([]); setFeedback(null); shownAt.current = Date.now(); deadline.current = Date.now() + 20000; done.current = false; }, [run.idx, run.ids[run.idx]]);
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 250); return () => clearInterval(t); }, []);

  const validate = (forced) => {
    if (feedback || done.current) return;
    const sel = forced || chosen;
    if (!sel.length && !forced) return;
    done.current = true;
    const ms = Date.now() - shownAt.current;
    update((s) => {
      const r = E.recordAnswer(s, q, sel, ms);
      const rr = s.run;
      const results = rr.results.concat({ id: q.id, chosen: sel, ok: r.ok, ms });
      let ids = rr.ids, requeued = rr.requeued || {};
      if (!r.ok && mode.feedback && !requeued[q.id] && rr.mode !== "errors") {
        const pos = Math.min(ids.length, rr.idx + 5);
        ids = ids.slice(0, pos).concat(q.id, ids.slice(pos)); requeued = { ...requeued, [q.id]: true };
      }
      return { ...r.state, run: { ...rr, results, ids, requeued, answered: true } };
    });
    if (mode.feedback) setFeedback({ ok: E.isCorrect(q, sel), chosen: sel });
    else advance();
  };

  function advance() {
    update((s) => {
      const rr = s.run;
      if (rr.idx + 1 >= rr.ids.length) return s; // la fin est gérée par finish()
      return { ...s, run: { ...rr, idx: rr.idx + 1, answered: false } };
    });
    if (run.idx + 1 >= run.ids.length) finish();
  }

  // Temps écoulé à l'examen : validation automatique (réponse vide = fausse).
  useEffect(() => {
    if (examTimer && !feedback && !done.current && now > deadline.current) validate(chosen.length ? chosen : ["__none__"]);
  }, [now]); // eslint-disable-line

  const toggle = (i) => { if (feedback) return; setChosen((c) => (c.includes(i) ? c.filter((x) => x !== i) : c.concat(i))); };

  useEffect(() => {
    const h = (e) => {
      if (e.target && (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA")) return;
      const k = e.key.toUpperCase();
      const n = { "1": 0, "2": 1, "3": 2, "4": 3, A: 0, B: 1, C: 2, D: 3 }[k];
      if (n != null && n < q.o.length) { e.preventDefault(); toggle(n); }
      if (e.key === "Enter") { e.preventDefault(); feedback ? advance() : validate(); }
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });

  const progress = (run.idx + (feedback ? 1 : 0)) / run.ids.length;
  const stepLeft = run.stepEnds && state.settings.stepTimer ? run.stepEnds - now : null;
  const qLeft = examTimer ? deadline.current - now : null;
  const answeredCount = run.results.length;
  const okCount = run.results.filter((r) => r.ok).length;

  const optClass = (i) => {
    if (!feedback) return chosen.includes(i) ? "opt sel" : "opt";
    const good = q.a.includes(i), picked = feedback.chosen.includes(i);
    return "opt " + (good ? "good " : "") + (picked && !good ? "bad " : "") + (picked ? "picked" : "");
  };

  return html`<div className="quiz">
    <div className="quiz-top">
      <div className="quiz-meta"><span className="mode-tag">${mode.name}</span><span className="num muted">${run.idx + 1}/${run.ids.length}</span>
        ${mode.feedback && answeredCount ? html`<span className="num muted">· ${okCount}/${answeredCount} justes</span>` : ""}</div>
      <div className="timers">
        ${stepLeft != null && html`<span className=${"timer " + (stepLeft <= 0 ? "late" : "")} title="Temps restant pour l'étape">${stepLeft > 0 ? "Étape " + fmtClock(stepLeft) : "Temps de l'étape écoulé"}</span>`}
        ${qLeft != null && html`<span className=${"timer " + (qLeft < 5000 ? "late" : "")}>${fmtClock(qLeft)}</span>`}
      </div>
    </div>
    <${Bar} value=${progress} tone="blue" />
    ${stepLeft != null && stepLeft <= 0 && html`<div className="notice">Le temps prévu pour cette étape est écoulé. Termine ta question puis clique sur « Terminer » pour passer à l'étape suivante.</div>`}

    <article className="card qcard" key=${run.idx + q.id}>
      <div className="q-head"><span className="cat">${CATS[q.c].short}</span>${q.d === 3 ? html`<span className="pill pill-hard">difficile</span>` : ""}</div>
      <${Scene} id=${q.img} />
      <h2 className="q-text">${q.q}</h2>
      <div className="muted small hint">Une ou plusieurs bonnes réponses. Touches A–D ou 1–4, Entrée pour valider.</div>
      <div className="opts">${q.o.map((o, i) => html`<button key=${i} className=${optClass(i)} onClick=${() => toggle(i)} aria-pressed=${chosen.includes(i)}>
        <span className="letter">${LETTERS[i]}</span><span className="opt-text">${o}</span></button>`)}</div>

      ${feedback && html`<div className=${"feedback " + (feedback.ok ? "fb-ok" : "fb-bad")}>
        <div className="fb-title">${feedback.ok ? "Bonne réponse" : "Mauvaise réponse"}</div>
        <div className="fb-line"><span className="muted">Bonne réponse :</span> <strong>${q.a.map((i) => LETTERS[i]).join(", ")}</strong>${!feedback.ok ? html` · <span className="muted">ton choix :</span> <strong>${feedback.chosen.filter((x) => typeof x === "number").map((i) => LETTERS[i]).join(", ") || "aucun"}</strong>` : ""}</div>
        <p>${q.e}</p>
        ${q.t && html`<p className="trap"><strong>Piège :</strong> ${q.t}</p>`}
        <div className="memo">${q.m}</div>
        ${q.r && html`<div className="ref muted small">${q.r}</div>`}
        ${!feedback.ok && run.mode !== "errors" && html`<div className="muted small">Cette question reviendra dans quelques questions, puis dans tes révisions.</div>`}
      </div>`}
    </article>

    <div className="quiz-actions">
      <button className="btn ghost" onClick=${onQuit}>${answeredCount ? "Terminer" : "Quitter"}</button>
      ${feedback ? html`<button className="btn primary" onClick=${advance}>${run.idx + 1 >= run.ids.length ? "Voir le bilan" : "Suivante"}</button>`
        : html`<button className="btn primary" disabled=${!chosen.length} onClick=${() => validate()}>Valider</button>`}
    </div>
  </div>`;
}

// ───────── Bilan ─────────
function Results({ session, state, start, go }) {
  if (!session) return html`<div className="card"><p>Aucun bilan à afficher.</p></div>`;
  const isExam = session.mode === "exam";
  const ok = session.correct, n = session.n;
  const cats = Object.entries(session.byCat).map(([k, v]) => ({ k, ...v, r: v.c / v.n })).sort((a, b) => a.r - b.r);
  const weakC = cats.filter((c) => c.r < 0.8), strongC = cats.filter((c) => c.r >= 0.8);
  const wrongQs = session.wrong.map((id) => QBY[id]).filter(Boolean);
  const answers = session.answers || {};
  return html`<div className="stack">
    <section className="card hero-res">
      <div className="eyebrow">${MODES[session.mode].name} · ${fmtDate(session.end)}</div>
      <div className="big"><span className=${isExam ? (ok >= 35 ? "ok" : "warn") : ok / n >= 0.875 ? "ok" : "warn"}>${ok}</span><small>/${n}</small></div>
      ${isExam ? html`<div className=${"verdict " + (ok >= 35 ? "ok" : "warn")}>${ok >= 35 ? "Examen réussi (35 ou plus)" : `Échec : ${35 - ok} bonne${35 - ok > 1 ? "s" : ""} réponse${35 - ok > 1 ? "s" : ""} de plus pour réussir`}</div>`
        : html`<div className="muted">${pct(ok / n)} de réussite au premier essai · durée ${fmtClock(session.end - session.start)}</div>`}
      <div className="row-btns"><button className="btn primary" onClick=${() => go("home")}>Tableau de bord</button>${wrongQs.length ? html`<button className="btn ghost" onClick=${() => start("errors")}>Refaire mes erreurs</button>` : ""}</div>
    </section>
    <div className="two">
      <section className="card"><h2>Points faibles</h2>${weakC.length ? html`<ul className="plain">${weakC.map((c) => html`<li key=${c.k}><span>${CATS[c.k].name}</span><span className="num bad">${c.c}/${c.n}</span></li>`)}</ul>` : html`<p className="muted">Aucun thème sous 80 % dans cette série.</p>`}</section>
      <section className="card"><h2>Points forts</h2>${strongC.length ? html`<ul className="plain">${strongC.map((c) => html`<li key=${c.k}><span>${CATS[c.k].name}</span><span className="num good">${c.c}/${c.n}</span></li>`)}</ul>` : html`<p className="muted">Pas encore de thème à 80 %.</p>`}</section>
    </div>
    ${wrongQs.length > 0 && html`<section className="card"><h2>Règles à revoir</h2><ul className="rules">${wrongQs.map((q) => html`<li key=${q.id}>${q.m}</li>`)}</ul></section>`}
    <section className="card">
      <h2>${isExam ? "Correction complète" : "Mes erreurs de la série"}</h2>
      ${(isExam ? session.order || [] : session.wrong).map((id) => {
        const q = QBY[id]; if (!q) return null;
        const a = answers[id] || []; const good = E.isCorrect(q, a);
        return html`<details className=${"corr " + (good ? "c-ok" : "c-bad")} key=${id} open=${!good && !isExam}>
          <summary><span className=${"pill " + (good ? "pill-ok" : "pill-bad")}>${good ? "juste" : "faux"}</span> ${q.q}</summary>
          <${Scene} id=${q.img} />
          <ul className="corr-opts">${q.o.map((o, i) => html`<li key=${i} className=${(q.a.includes(i) ? "good " : "") + (a.includes(i) && !q.a.includes(i) ? "bad" : "")}><span className="letter">${LETTERS[i]}</span>${o}${a.includes(i) ? html` <em className="muted">(ton choix)</em>` : ""}</li>`)}</ul>
          <p>${q.e}</p>${q.t && html`<p className="trap"><strong>Piège :</strong> ${q.t}</p>`}<div className="memo">${q.m}</div>
        </details>`;
      })}
      ${!isExam && !wrongQs.length && html`<p className="muted">Aucune erreur. Bien joué.</p>`}
    </section>
  </div>`;
}

// ───────── Données ─────────
function Data({ state, update, sync }) {
  const [text, setText] = useState("");
  const [msg, setMsg] = useState("");
  const [confirmReset, setConfirmReset] = useState(false);
  const [dl, setDl] = useState(null);
  const report = useMemo(() => E.assistantReport(state, QUESTIONS, CATS), [state]);
  useEffect(() => { if (window.claude && window.claude.use) window.claude.use("downloads").then(setDl).catch(() => {}); }, []);
  const exportJson = () => JSON.stringify({ ...state, run: undefined }, null, 0);

  const copy = async (t, label) => {
    try { await navigator.clipboard.writeText(t); setMsg(label + " copié."); }
    catch (e) { setText(t); setMsg("Copie automatique refusée : le texte est dans le champ ci-dessous, sélectionne-le et copie-le."); }
  };
  const doImport = (raw) => {
    try {
      const s = JSON.parse(raw);
      if (!validState(s)) throw new Error("format");
      update(() => ({ ...E.emptyState(), ...s, run: null, updated: Date.now() }));
      setMsg("Données importées : " + Object.keys(s.q).length + " questions et " + s.sessions.length + " sessions.");
    } catch (e) { setMsg("Import impossible : ce texte n'est pas une sauvegarde valide de l'application."); }
  };
  const onFile = (e) => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(r.result); r.readAsText(f); };
  const syncText = {
    connecting: "Connexion à la base de l'artifact…",
    synced: "Synchronisé : tes résultats sont enregistrés dans la base de l'artifact. Dans la conversation, demande « analyse mes résultats » et Claude les lira directement.",
    saving: "Enregistrement en cours…",
    local: "Sauvegarde locale uniquement (navigateur). La base de l'artifact n'est pas accessible dans cette vue : utilise « Copier le rapport » et colle-le dans la conversation.",
    error: "La base de l'artifact a refusé l'enregistrement. Tes données restent sauvegardées dans ce navigateur.",
    full: "La base de l'artifact est pleine. Exporte tes données puis réinitialise l'historique.",
  }[sync];

  return html`<div className="stack">
    <section className="card"><h2>Sauvegarde et synchronisation</h2>
      <div className=${"sync-box s-" + sync}><span className="dot"></span><span>${syncText}</span></div>
      <p className="muted small">Les données sont aussi gardées dans ce navigateur (localStorage). Tu peux fermer la page et revenir plus tard ; la base de l'artifact te permet de reprendre sur un autre appareil connecté au même compte.</p>
    </section>
    <section className="card"><h2>Rapport pour l'assistant</h2>
      <p className="muted small">Résumé compact de tes résultats, à coller dans la conversation si la synchronisation ne fonctionne pas.</p>
      <pre className="report">${report}</pre>
      <button className="btn primary" onClick=${() => copy(report, "Rapport")}>Copier le rapport</button>
    </section>
    <section className="card"><h2>Exporter / importer</h2>
      <div className="row-btns">
        <button className="btn ghost" onClick=${() => copy(exportJson(), "Sauvegarde")}>Copier la sauvegarde</button>
        ${dl && html`<button className="btn ghost" onClick=${() => dl.save({ filename: "code-route-sauvegarde.json", data: exportJson() }).then(() => setMsg("Fichier enregistré.")).catch(() => setMsg("Téléchargement annulé ou refusé."))}>Télécharger (.json)</button>`}
        <label className="btn ghost file">Importer un fichier<input id="importfile" type="file" accept=".json,application/json" onChange=${onFile} /></label>
      </div>
      <label className="muted small" htmlFor="importtext">Ou colle une sauvegarde ici :</label>
      <textarea id="importtext" rows="4" value=${text} onChange=${(e) => setText(e.target.value)} placeholder='{"v":1,...}'></textarea>
      <div className="row-btns"><button className="btn ghost" disabled=${!text.trim()} onClick=${() => doImport(text)}>Importer le texte</button></div>
      ${msg && html`<div className="notice">${msg}</div>`}
    </section>
    <section className="card"><h2>Réglages</h2>
      <label className="switch"><input id="examtimer" type="checkbox" checked=${state.settings.examTimer} onChange=${(e) => update((s) => ({ ...s, settings: { ...s.settings, examTimer: e.target.checked } }))} /> Limite de 20 secondes par question à l'examen blanc</label>
      <div className="row-btns">${confirmReset ? html`<span className="small">Tout effacer définitivement ?</span><button className="btn danger sm" onClick=${() => { update(() => ({ ...E.emptyState(), updated: Date.now() })); setConfirmReset(false); setMsg("Progression réinitialisée."); }}>Oui, effacer</button><button className="btn ghost sm" onClick=${() => setConfirmReset(false)}>Annuler</button>`
        : html`<button className="btn ghost sm" onClick=${() => setConfirmReset(true)}>Réinitialiser la progression</button>`}</div>
    </section>
  </div>`;
}

// ───────── Application ─────────
const VIEWS = [["home", "Accueil"], ["sprint", "Sprint"], ["modes", "Réviser"], ["data", "Données"]];

function App() {
  const [state, update, sync] = useStore();
  const [view, setView] = useState(() => {
    if (loadLocal() && loadLocal().run) return "quiz"; // reprise automatique d'une série interrompue
    const h = (location.hash || "").slice(1);
    return ["home", "sprint", "modes", "data"].includes(h) ? h : "home";
  });
  const [lastSession, setLastSession] = useState(null);
  const [toast, setToast] = useState("");

  const go = (v) => { setView(v); if (["home", "sprint", "modes", "data"].includes(v)) { try { history.replaceState(null, "", "#" + v); } catch (e) { location.hash = v; } } window.scrollTo(0, 0); };
  useEffect(() => { const h = () => { const v = location.hash.slice(1); if (["home", "sprint", "modes", "data"].includes(v)) setView(v); }; window.addEventListener("hashchange", h); return () => window.removeEventListener("hashchange", h); }, []);
  useEffect(() => { if (!toast) return; const t = setTimeout(() => setToast(""), 3500); return () => clearTimeout(t); }, [toast]);

  const start = (mode, step = null, onlyCat = null) => {
    let ids;
    if (onlyCat) {
      const sub = QUESTIONS.filter((q) => q.c === onlyCat);
      ids = E.buildSession("target", sub, state, CATS, 15).map((q) => q.id);
    } else {
      let m = mode;
      if (m === "errors" && !QUESTIONS.some((q) => E.isActiveError(state.q[q.id]))) { m = "consolidate"; setToast("Aucune erreur active : série de consolidation à la place."); }
      ids = E.buildSession(m, QUESTIONS, state, CATS, step && step.n).map((q) => q.id);
      mode = m;
    }
    if (!ids.length) { setToast("Aucune question disponible pour ce mode."); return; }
    const now = Date.now();
    update((s) => ({ ...s, run: { mode, ids, idx: 0, results: [], startedAt: now, stepId: step ? step.id : null, stepEnds: step ? now + step.min * 60000 : null, requeued: {} } }));
    setView("quiz"); window.scrollTo(0, 0);
  };

  const finish = useCallback(() => {
    update((s) => {
      const rr = s.run; if (!rr) return s;
      if (!rr.results.length) { setLastSession(null); return { ...s, run: null }; }
      const sum = E.summarize(rr.mode, rr.results, QUESTIONS, rr.startedAt);
      const answers = {}; for (const r of rr.results) if (!(r.id in answers)) answers[r.id] = r.chosen.filter((x) => typeof x === "number");
      const order = []; for (const r of rr.results) if (!order.includes(r.id)) order.push(r.id);
      const full = { ...sum, answers, order };
      setLastSession(full);
      const stored = { ...sum, wrong: sum.wrong.slice(0, 40) };
      const sprint = rr.stepId ? { ...s.sprint, done: { ...s.sprint.done, [rr.stepId]: true } } : s.sprint;
      return { ...s, run: null, sessions: s.sessions.concat(stored).slice(-80), sprint, updated: Date.now() };
    });
    setView("results"); window.scrollTo(0, 0);
  }, [update]);

  const activeErrors = QUESTIONS.filter((q) => E.isActiveError(state.q[q.id])).length;
  const showQuiz = view === "quiz" && state.run;

  return html`<div className="app">
    <header className="top">
      <div className="brand"><span className="logo" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M16 3 L29 26 H3 Z" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><path d="M16 12 v7 M16 22 v1.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></span><span>Code<b>Sprint</b></span></div>
      <nav>${VIEWS.map(([k, l]) => html`<button key=${k} className=${"nav " + (view === k ? "on" : "")} onClick=${() => go(k)}>${l}${k === "modes" && activeErrors ? html`<span className="badge">${activeErrors}</span>` : ""}</button>`)}</nav>
      <span className=${"sync-dot s-" + sync} title=${"Synchronisation : " + sync}></span>
    </header>
    <main>
      ${showQuiz ? html`<${Quiz} state=${state} update=${update} finish=${finish} onQuit=${finish} />`
        : view === "results" && lastSession ? html`<${Results} session=${lastSession} state=${state} start=${start} go=${go} />`
        : view === "sprint" ? html`<${Sprint} state=${state} update=${update} start=${start} />`
        : view === "modes" ? html`<${Modes} state=${state} start=${start} />`
        : view === "data" ? html`<${Data} state=${state} update=${update} sync=${sync} />`
        : html`<${Dashboard} state=${state} go=${go} start=${start} />`}
    </main>
    <footer className="foot muted small">${QUESTIONS.length} questions originales, vérifiées sur les règles en vigueur fin 2026. Elles ne reproduisent pas les questions officielles.</footer>
    ${toast && html`<div className="toast" role="status">${toast}</div>`}
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);

</script>
